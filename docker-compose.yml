services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: scheduler
      POSTGRES_DB: scheduler
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduler"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: scheduler
      RABBITMQ_DEFAULT_PASS: scheduler
    volumes:
      - rabbitdata:/var/lib/rabbitmq

  scheduler:
    build: .
    command: ["/bin/scheduler"]
    ports:
      - "50051:50051"
    environment:
      DATABASE_URL: postgres://scheduler:scheduler@postgres:5432/scheduler?sslmode=disable
      RABBITMQ_URL: amqp://scheduler:scheduler@rabbitmq:5672/
      REDIS_ADDR: redis:6379
      PORT: "50051"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started

  worker:
    build: .
    command: ["/bin/worker"]
    ports:
      - "50052:50052"
    environment:
      DATABASE_URL: postgres://scheduler:scheduler@postgres:5432/scheduler?sslmode=disable
      RABBITMQ_URL: amqp://scheduler:scheduler@rabbitmq:5672/
      REDIS_ADDR: redis:6379
      WORKER_ID: worker-1
      PORT: "50052"
      MAX_CONCURRENCY: "10"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started

volumes:
  pgdata:
  redisdata:
  rabbitdata:
