syntax = "proto3";

package v1;

option go_package = "github.com/prsamohamadi/distributed-job-scheduler/pkg/api/v1;v1";

import "google/protobuf/timestamp.proto";

// JobStatus represents the state machine stages of a distributed job.
enum JobStatus {
  JOB_STATUS_UNSPECIFIED = 0;
  JOB_STATUS_PENDING = 1;
  JOB_STATUS_RUNNING = 2;
  JOB_STATUS_SUCCEEDED = 3;
  JOB_STATUS_FAILED = 4;
  JOB_STATUS_CANCELLED = 5;
  JOB_STATUS_DEAD = 6;
}

// JobPriority defines scheduling priority levels.
enum JobPriority {
  JOB_PRIORITY_UNSPECIFIED = 0;
  JOB_PRIORITY_LOW = 1;
  JOB_PRIORITY_DEFAULT = 2;
  JOB_PRIORITY_HIGH = 3;
  JOB_PRIORITY_CRITICAL = 4;
}

// Job represents a single unit of scheduled execution.
message Job {
  string id = 1;
  string tenant_id = 2;
  string name = 3;
  JobStatus status = 4;
  // Omitted by ListJobs; retrieve payload with GetJob.
  bytes payload = 5;
  JobPriority priority = 6;
  int32 attempt_count = 7;
  int32 max_attempts = 8;
  optional string depends_on = 9;
  google.protobuf.Timestamp scheduled_at = 10;
  optional google.protobuf.Timestamp next_retry_at = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
  int64 fencing_token = 14;
  int64 timeout_ms = 15;
  string idempotency_key = 16;
  // Terminal payload retention has removed the executable input.
  bool payload_expired = 17;
}

// JobEvent records status transitions for audit trailing.
message JobEvent {
  string id = 1;
  string job_id = 2;
  JobStatus from_status = 3;
  JobStatus to_status = 4;
  google.protobuf.Timestamp occurred_at = 5;
  string worker_id = 6;
  // A safe execution-result category; arbitrary handler error text is omitted.
  string message = 7;
}
