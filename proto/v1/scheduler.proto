syntax = "proto3";

package v1;

option go_package = "github.com/prsamohamadi/distributed-job-scheduler/pkg/api/v1;v1";

import "google/protobuf/timestamp.proto";
import "proto/v1/job.proto";

// SchedulerService orchestrates job submissions, queries, state transitions,
// dependency resolutions, outbox reconciliation, and dispatching.
service SchedulerService {
  // SubmitJob validates and persists a job via transactional outbox.
  rpc SubmitJob(SubmitJobRequest) returns (SubmitJobResponse);

  // GetJob retrieves the current state and metadata of a specific job.
  rpc GetJob(GetJobRequest) returns (GetJobResponse);

  // ListJobs returns metadata only (no payload), with count and byte bounded pages.
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse);

  // CancelJob cancels a job only if it is currently in PENDING status.
  rpc CancelJob(CancelJobRequest) returns (CancelJobResponse);

  // GetJobEvents returns a bounded chronological page of safe audit metadata.
  rpc GetJobEvents(GetJobEventsRequest) returns (GetJobEventsResponse);

  // ReportJobCompletion is invoked when a worker finishes job execution,
  // resolving any downstream dependent jobs.
  rpc ReportJobCompletion(ReportJobCompletionRequest) returns (ReportJobCompletionResponse);

  // Dispatch manually or periodically triggers scheduling and dispatch of ready jobs.
  rpc Dispatch(DispatchRequest) returns (DispatchResponse);

  // TriggerReconciliation manually kicks off outbox reconciliation for unpublished jobs.
  rpc TriggerReconciliation(TriggerReconciliationRequest) returns (TriggerReconciliationResponse);

  // RequeueDeadJob gives a dead job another retry budget. ListJobs with DEAD lists candidates.
  rpc RequeueDeadJob(RequeueDeadJobRequest) returns (RequeueDeadJobResponse);

  // ClaimJobExecution acknowledges an announcement's delivery and claims the
  // announced attempt for a worker, minting its fencing token and lease.
  // Workers have no database access; this is their only path to claim work.
  rpc ClaimJobExecution(ClaimJobExecutionRequest) returns (ClaimJobExecutionResponse);

  // RenewJobLease extends a live lease held by the exact worker and token.
  rpc RenewJobLease(RenewJobLeaseRequest) returns (RenewJobLeaseResponse);

  // GetExecutionJob returns a job with its lease state for worker reconciliation.
  rpc GetExecutionJob(GetExecutionJobRequest) returns (GetExecutionJobResponse);
}

message SubmitJobRequest {
  string tenant_id = 1;
  string name = 2;
  bytes payload = 3;
  JobPriority priority = 4;
  int32 max_attempts = 5;
  optional string depends_on = 6;
  optional google.protobuf.Timestamp scheduled_at = 7;
  string idempotency_key = 8;
  int64 timeout_ms = 9;
}

message RequeueDeadJobRequest { string job_id = 1; }
message RequeueDeadJobResponse { Job job = 1; }

message SubmitJobResponse {
  Job job = 1;
}

message GetJobRequest {
  string tenant_id = 1;
  string job_id = 2;
}

message GetJobResponse {
  Job job = 1;
}

message ListJobsRequest {
  string tenant_id = 1;
  optional JobStatus status = 2;
  optional JobPriority priority = 3;
  // Defaults to 100; maximum 1000. A byte budget may shorten a page further.
  int32 limit = 4;
  int32 offset = 5;
}

message ListJobsResponse {
  repeated Job jobs = 1;
  int64 total_count = 2;
  // Continue at next_offset while has_more is true. Use the same filters.
  int32 next_offset = 3;
  bool has_more = 4;
}

message CancelJobRequest {
  string tenant_id = 1;
  string job_id = 2;
  string reason = 3;
}

message CancelJobResponse {
  Job job = 1;
  string message = 2;
}

message GetJobEventsRequest {
  string tenant_id = 1;
  string job_id = 2;
  // Defaults to 100; maximum 1000. A byte budget may shorten a page further.
  int32 limit = 3;
  int32 offset = 4;
}

message GetJobEventsResponse {
  repeated JobEvent events = 1;
  // Continue at next_offset while has_more is true.
  int32 next_offset = 2;
  bool has_more = 3;
}

message ReportJobCompletionRequest {
  string job_id = 1;
  string worker_id = 2;
  JobStatus final_status = 3;
  int64 fencing_token = 4;
  string error_message = 5;
}

message ReportJobCompletionResponse {
  bool acknowledged = 1;
  int32 dependents_unlocked = 2;
}

message DispatchRequest {
  int32 batch_size = 1;
}

message DispatchResponse {
  int32 dispatched_count = 1;
}

message TriggerReconciliationRequest {
  bool force = 1;
}

message TriggerReconciliationResponse {
  int32 reconciled_count = 1;
}

message ClaimJobExecutionRequest {
  string job_id = 1;
  int32 attempt_count = 2;
  int64 fencing_token = 3;
  string worker_id = 4;
  int64 lease_ttl_ms = 5;
}

message ClaimJobExecutionResponse {
  Job job = 1;
  int64 fencing_token = 2;
}

message RenewJobLeaseRequest {
  string job_id = 1;
  string worker_id = 2;
  int64 fencing_token = 3;
  int64 lease_ttl_ms = 4;
}

message RenewJobLeaseResponse {}

message GetExecutionJobRequest {
  string job_id = 1;
}

message GetExecutionJobResponse {
  Job job = 1;
  optional string lease_owner = 2;
  optional google.protobuf.Timestamp lease_expires_at = 3;
}
